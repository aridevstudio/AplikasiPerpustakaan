<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Anggota</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Form Anggota</h1>
        <form method="POST" action="Anggota/add_anggota.php">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nis" class="form-label">NIS</label>
                    <input type="text" class="form-control" id="nis" name="nis" placeholder="Contoh: 230103161" required>
                </div>
                <div class="col-md-6">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama" required>
                </div>
                <div class="col-md-6">
                    <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
                    <select class="form-select" id="jenis_kelamin" name="jenis_kelamin" required>
                        <option value="" disabled selected>Pilih Jenis Kelamin</option>
                        <option value="Laki-Laki">Laki-Laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="jurusan" class="form-label">Jurusan</label>
                    <select class="form-select" id="jurusan" name="jurusan" required>
                        <option value="" disabled selected>Pilih Jurusan Anda</option>
                       <option value="Akuntansi dan Keuangan Lembaga">Akuntansi dan Keuangan Lembaga</option>
                    <option value="Otomatisasi dan Tata Kelola Perkantoran">Otomatisasi dan Tata Kelola Perkantoran</option>
                    <option value="Bisnis Daring dan Pemasaran">Bisnis Daring dan Pemasaran</option>
                    <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                    <option value="Akomodasi Perhotelan">Akomodasi Perhotelan</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="tgl_lahir" class="form-label">Tanggal Lahir</label>
                    <input type="date" class="form-control" id="tgl_lahir" name="tgl_lahir" required>
                </div>
                <div class="col-md-6">
                    <label for="kelas" class="form-label">Kelas</label>
                    <select class="form-select" id="kelas" name="kelas" required>
                        <option value="" disabled selected>Pilih Kelas</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button type="reset" class="btn btn-secondary me-2">Reset</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const jurusanToKelas = {
                 "Akuntansi dan Keuangan Lembaga": ["X", "XI", "XII"],
            "Otomatisasi dan Tata Kelola Perkantoran": ["X", "XI", "XII"],
            "Bisnis Daring dan Pemasaran": ["X", "XI", "XII"],
            "Rekayasa Perangkat Lunak": ["X", "XI", "XII"],
            "Akomodasi Perhotelan": ["X", "XI", "XII"]
            };

            const jurusanDropdown = document.getElementById("jurusan");
            const kelasDropdown = document.getElementById("kelas");

            jurusanDropdown.addEventListener("change", function () {
                const jurusan = this.value;

                // Reset kelas options
                kelasDropdown.innerHTML = '<option value="" disabled selected>Pilih Kelas</option>';

                if (jurusan in jurusanToKelas) {
                    jurusanToKelas[jurusan].forEach(kelas => {
                        const option = document.createElement("option");
                        option.value = kelas;
                        option.textContent = kelas;
                        kelasDropdown.appendChild(option);
                    });
                }
            });
        });
    </script>
</body>

</html>
